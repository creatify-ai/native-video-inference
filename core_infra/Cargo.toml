[package]
name = "native-core-infra"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
cuda = []
# Streaming in-place checkpoint loads (model_load.rs); the model crate links kernels/convert.cu.
model-load = ["cuda"]
avx-noise = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
