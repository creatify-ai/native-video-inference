name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test the source package
        run: python tools/check_public.py
      - name: Check native target types
        env:
          H3_CHECK_ONLY: "1"
          WAN_CHECK_ONLY: "1"
          LTX25_CHECK_ONLY: "1"
          NATIVE_CORE_CHECK_ONLY: "1"
        run: cargo check --locked --workspace --all-targets --all-features
