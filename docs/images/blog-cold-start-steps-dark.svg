<svg xmlns="http://www.w3.org/2000/svg" width="760" height="266" viewBox="0 0 760 266" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img" aria-label="One cold container step by step. The video encoder, the DiT and the Qwen text encoder start loading together; the two frames are encoded as soon as the video encoder has loaded, the DiT input is laid out as soon as the DiT has loaded, and the prompt is encoded as soon as the text encoder has loaded; the first denoising step starts at 7.2 seconds. Output decoders load after the first step."><style>text{fill:#c3c2b7}.lbl{fill:#f0efec}.mut{fill:#898781}.num{font-variant-numeric:tabular-nums}</style><rect width="100%" height="100%" rx="6" fill="#1a1a19"/>
<rect x="150" y="10" width="12" height="12" rx="2" style="fill:#5a5a55"/><text x="168.0" y="20.0" text-anchor="start" font-size="12.5">bootstrap</text>
<rect x="250" y="10" width="12" height="12" rx="2" style="fill:#3987e5"/><text x="268.0" y="20.0" text-anchor="start" font-size="12.5">loading weights</text>
<rect x="388" y="10" width="12" height="12" rx="2" style="fill:#d95926"/><text x="406.0" y="20.0" text-anchor="start" font-size="12.5">work for the first request</text>
