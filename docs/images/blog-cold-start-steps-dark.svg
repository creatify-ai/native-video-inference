<text x="140.0" y="65.0" text-anchor="end" font-size="12" class="lbl">Bootstrap</text>
<rect x="150.6" y="52" width="7.1" height="18" rx="2" style="fill:#5a5a55"><title>Bootstrap: 0.01–0.14 s</title></rect>
<text x="140.0" y="95.0" text-anchor="end" font-size="12" class="lbl">Request setup (CPU)</text>
<rect x="158.6" y="82" width="23.1" height="18" rx="2" style="fill:#d95926"><title>Request setup (CPU): 0.15–0.56 s</title></rect>
<rect x="184.7" y="83" width="141.7" height="16" style="fill:#1a1a19"/>
<text x="187.7" y="95.0" text-anchor="start" font-size="11" class="mut">shapes and noise 0.41 s</text>
