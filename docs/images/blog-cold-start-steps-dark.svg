<text x="283.7" y="125.0" text-anchor="start" font-size="11" class="mut">encode the two frames 0.22 s</text>
<text x="140.0" y="155.0" text-anchor="end" font-size="12" class="lbl">DiT</text>
<rect x="158.7" y="142" width="324.1" height="18" rx="2" style="fill:#3987e5"><title>DiT: 0.15–5.92 s</title></rect>
<rect x="482.8" y="142" width="47.1" height="18" rx="2" style="fill:#d95926"><title>DiT: 5.92–6.75 s</title></rect>
<rect x="532.9" y="143" width="147.6" height="16" style="fill:#1a1a19"/>
<text x="535.9" y="155.0" text-anchor="start" font-size="11" class="mut">lay out its input 0.84 s</text>
<text x="140.0" y="185.0" text-anchor="end" font-size="12" class="lbl">Qwen text encoder</text>
<rect x="158.7" y="172" width="383.9" height="18" rx="2" style="fill:#3987e5"><title>Qwen text encoder: 0.15–6.98 s</title></rect>
<rect x="542.5" y="172" width="12.5" height="18" rx="2" style="fill:#d95926"><title>Qwen text encoder: 6.98–7.20 s</title></rect>
<rect x="558.0" y="173" width="147.6" height="16" style="fill:#1a1a19"/>
<text x="561.0" y="185.0" text-anchor="start" font-size="11" class="mut">encode the prompt 0.22 s</text>
<text x="140.0" y="215.0" text-anchor="end" font-size="12" class="lbl">Output decoders</text>
<rect x="557.5" y="202" width="190.5" height="18" rx="2" style="fill:none;stroke:#383835" stroke-dasharray="3 2"/>
<text x="563.5" y="215.0" text-anchor="start" font-size="11" class="mut">load after the first step</text>
<text x="600.0" y="257.0" text-anchor="end" font-size="10.5" class="mut">seconds from the first handler instruction</text>
