<text x="206.2" y="241.0" text-anchor="middle" font-size="11" class="mut num">1 s</text>
<line x1="262.5" y1="44" x2="262.5" y2="226" style="stroke:#2c2c2a" stroke-width="1"/>
<text x="262.5" y="241.0" text-anchor="middle" font-size="11" class="mut num">2 s</text>
<line x1="318.8" y1="44" x2="318.8" y2="226" style="stroke:#2c2c2a" stroke-width="1"/>
<text x="318.8" y="241.0" text-anchor="middle" font-size="11" class="mut num">3 s</text>
<line x1="375.0" y1="44" x2="375.0" y2="226" style="stroke:#2c2c2a" stroke-width="1"/>
<text x="375.0" y="241.0" text-anchor="middle" font-size="11" class="mut num">4 s</text>
<line x1="431.2" y1="44" x2="431.2" y2="226" style="stroke:#2c2c2a" stroke-width="1"/>
<text x="431.2" y="241.0" text-anchor="middle" font-size="11" class="mut num">5 s</text>
<line x1="487.5" y1="44" x2="487.5" y2="226" style="stroke:#2c2c2a" stroke-width="1"/>
<text x="487.5" y="241.0" text-anchor="middle" font-size="11" class="mut num">6 s</text>
<line x1="543.8" y1="44" x2="543.8" y2="226" style="stroke:#2c2c2a" stroke-width="1"/>
<text x="543.8" y="241.0" text-anchor="middle" font-size="11" class="mut num">7 s</text>
<line x1="600.0" y1="44" x2="600.0" y2="226" style="stroke:#2c2c2a" stroke-width="1"/>
<text x="600.0" y="241.0" text-anchor="middle" font-size="11" class="mut num">8 s</text>
<line x1="557.5" y1="44" x2="557.5" y2="226" style="stroke:#f0efec" stroke-width="1" stroke-dasharray="3 3"/>
