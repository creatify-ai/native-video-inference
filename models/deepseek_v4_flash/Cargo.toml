[package]
name = "dsv4-flash-native"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
build = "build.rs"

[features]
default = []
cuda = ["native-core-infra/model-load"]
# One TP rank of DeepSeek-V4-Pro (--tp 8) instead of Flash on one GPU: model dimensions and layer kinds.
pro = []

[dependencies]
native-core-infra = { path = "../../core_infra" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[lib]
path = "lib.rs"

[[bin]]
name = "dsv4"
path = "bin/dsv4.rs"
