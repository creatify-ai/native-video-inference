[package]
name = "h3-official-conditioner"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[features]
default = []
cuda = ["native-core-infra/cuda"]

[dependencies]
native-core-infra = { path = "../../../core_infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }



[[bin]]
name = "h3-official-conditioner"
path = "main.rs"
