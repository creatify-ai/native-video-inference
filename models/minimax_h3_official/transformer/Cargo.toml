[package]
name = "h3-official-native-run"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[features]
default = []
cuda = ["dep:h3_router", "native-core-infra/cuda"]

[dependencies]
native-core-infra = { path = "../../../core_infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
h3-native-pipeline = { package = "h3-official-model-pipeline", path = "../pipeline" }
h3_router = { package = "h3-official-dit-router", path = "router", optional = true }

[[bin]]
name = "h3-official-model-run"
path = "main.rs"
required-features = ["cuda"]


[[bin]]
name = "h3-official-cp-coordinator"
path = "bin/h3-cp-coordinator.rs"
required-features = ["cuda"]

[lib]
path = "lib.rs"

[[bin]]
name = "h3-official-validate"
path = "bin/h3-validate.rs"
required-features = ["cuda"]
