[package]
name = "h3-official-model-pipeline"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[features]
default = []
avx-noise = ["native-core-infra/avx-noise"]

[dependencies]
native-core-infra = { path = "../../../core_infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
png = "=0.17.16"

[lib]
path = "lib.rs"

[[bin]]
name = "h3-official-model-pipeline"
path = "main.rs"
required-features = ["avx-noise"]
